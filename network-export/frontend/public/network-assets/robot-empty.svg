<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGlassEmpty" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#F0FDF8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#D1FAE5" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="healthyGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="visorGlassEmpty" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F291E" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <radialGradient id="greenAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#34D399" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#10B981" flood-opacity="0.2" />
    </filter>
    <filter id="elementGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Green Ambient Shield Halo -->
  <circle cx="100" cy="100" r="82" fill="url(#greenAura)" />
  <circle cx="100" cy="100" r="76" fill="none" stroke="url(#healthyGreen)" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.6" />

  <!-- Protective Glass Halo Rings -->
  <ellipse cx="100" cy="148" rx="60" ry="18" fill="rgba(16, 185, 129, 0.08)" stroke="url(#healthyGreen)" stroke-width="1.5" opacity="0.7" />

  <!-- Robot Spherical Body -->
  <g filter="url(#softGlow)">
    <circle cx="100" cy="115" r="46" fill="url(#bodyGlassEmpty)" stroke="rgba(255, 255, 255, 0.95)" stroke-width="2.5" />
    
    <!-- Shield Insignia Core -->
    <path d="M100 102 L114 108 C114 122 106 132 100 135 C94 132 86 122 86 108 Z" 
          fill="url(#healthyGreen)" opacity="0.9" filter="url(#elementGlow)" />
    <!-- Checkmark inside Shield -->
    <path d="M94 117 L98 122 L107 112" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Cute Zen Eyes (Happy curved arcs) -->
    <path d="M85 86 C87 80 93 80 95 86" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" filter="url(#elementGlow)" />
    <path d="M105 86 C107 80 113 80 115 86" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" filter="url(#elementGlow)" />

    <!-- Glowing Leaf / Antenna Signal on Top -->
    <path d="M100 69 L100 52" stroke="url(#healthyGreen)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="100" cy="48" r="5" fill="#34D399" filter="url(#elementGlow)" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- Subtle Floating Glass Glare -->
    <path d="M80 82 C88 74 112 74 120 82" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Floating Green Sparks -->
  <circle cx="48" cy="75" r="3" fill="#10B981" filter="url(#elementGlow)" />
  <circle cx="152" cy="70" r="3.5" fill="#34D399" filter="url(#elementGlow)" />
  <circle cx="140" cy="138" r="2.5" fill="#10B981" filter="url(#elementGlow)" />
  <circle cx="60" cy="142" r="2.5" fill="#34D399" filter="url(#elementGlow)" />
</svg>

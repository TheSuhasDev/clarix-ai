<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#EBF5FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C5E1FE" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="primaryCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9F5" />
      <stop offset="100%" stop-color="#176BFF" />
    </linearGradient>
    <linearGradient id="visorGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14243B" />
      <stop offset="100%" stop-color="#0B1524" />
    </linearGradient>
    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8174FF" />
      <stop offset="100%" stop-color="#C5B9FF" />
    </linearGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D9F5" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#176BFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#176BFF" stop-opacity="0" />
    </radialGradient>
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#176BFF" flood-opacity="0.15" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Light Backing -->
  <circle cx="100" cy="100" r="75" fill="url(#ringGlow)" />

  <!-- Floating Orbital Gyro Ring -->
  <ellipse cx="100" cy="105" rx="72" ry="24" fill="none" stroke="url(#primaryCyan)" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.6" transform="rotate(-15 100 105)" />
  <circle cx="34" cy="90" r="4.5" fill="#00D9F5" filter="url(#glowEffect)" />
  <circle cx="166" cy="120" r="3.5" fill="#8174FF" filter="url(#glowEffect)" />

  <!-- Base Body Shell (Liquid Glass) -->
  <g filter="url(#glassShadow)">
    <path d="M60 145 C60 120 75 110 100 110 C125 110 140 120 140 145 C140 162 122 172 100 172 C78 172 60 162 60 145 Z" 
          fill="url(#bodyGlass)" stroke="rgba(255,255,255,0.9)" stroke-width="2" />
    <!-- Chest Core Gauge -->
    <circle cx="100" cy="142" r="14" fill="#0E1E34" stroke="url(#primaryCyan)" stroke-width="1.8" />
    <circle cx="100" cy="142" r="9" fill="url(#primaryCyan)" opacity="0.85" filter="url(#glowEffect)" />
    <path d="M96 142 L100 137 L104 142 L100 147 Z" fill="#FFFFFF" />
  </g>

  <!-- Floating Glass Head -->
  <g filter="url(#glassShadow)">
    <rect x="52" y="45" width="96" height="74" rx="37" fill="url(#bodyGlass)" stroke="rgba(255,255,255,0.95)" stroke-width="2.2" />
    
    <!-- Top Antenna Node -->
    <path d="M100 45 L100 28" stroke="url(#primaryCyan)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="100" cy="24" r="5" fill="#00D9F5" filter="url(#glowEffect)" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- Glass Ear Pods -->
    <rect x="44" y="65" width="10" height="26" rx="5" fill="url(#violetGlow)" stroke="#FFFFFF" stroke-width="1.5" />
    <rect x="146" y="65" width="10" height="26" rx="5" fill="url(#primaryCyan)" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- Visor Face Panel -->
    <rect x="62" y="55" width="76" height="48" rx="22" fill="url(#visorGlass)" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" />

    <!-- Expressive AI Eyes -->
    <ellipse cx="84" cy="76" rx="9" ry="11" fill="#00D9F5" filter="url(#glowEffect)" />
    <ellipse cx="116" cy="76" rx="9" ry="11" fill="#00D9F5" filter="url(#glowEffect)" />
    <ellipse cx="86" cy="73" rx="3.5" ry="4.5" fill="#FFFFFF" />
    <ellipse cx="118" cy="73" rx="3.5" ry="4.5" fill="#FFFFFF" />

    <!-- Soft Smile / Data Wave -->
    <path d="M92 90 Q100 95 108 90" stroke="#00D9F5" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9" />

    <!-- Glass Specular Highlight -->
    <path d="M68 59 C75 52 110 52 124 57" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="loadGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#EFF6FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#DBEAFE" stop-opacity="0.65" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9F5" />
      <stop offset="50%" stop-color="#8174FF" />
      <stop offset="100%" stop-color="#176BFF" />
    </linearGradient>
    <radialGradient id="scanBeam" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#00D9F5" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#176BFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8174FF" stop-opacity="0" />
    </radialGradient>
    <filter id="analyzingGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Pulsing Core Glow -->
  <circle cx="100" cy="100" r="78" fill="#176BFF" opacity="0.08" />

  <!-- Outer Orbital Glass Track 1 -->
  <g>
    <ellipse cx="100" cy="100" rx="80" ry="32" fill="none" stroke="url(#scanGrad)" stroke-width="2.5" stroke-dasharray="16 8 4 8" opacity="0.75" transform="rotate(-25 100 100)" />
    <circle cx="30" cy="70" r="5" fill="#00D9F5" filter="url(#analyzingGlow)" />
  </g>

  <!-- Outer Orbital Glass Track 2 -->
  <g>
    <ellipse cx="100" cy="100" rx="80" ry="32" fill="none" stroke="#8174FF" stroke-width="2" stroke-dasharray="8 6" opacity="0.7" transform="rotate(35 100 100)" />
    <circle cx="170" cy="80" r="4" fill="#8174FF" filter="url(#analyzingGlow)" />
  </g>

  <!-- Central Glass Floating Drone Orb -->
  <circle cx="100" cy="100" r="42" fill="url(#loadGlass)" stroke="rgba(255, 255, 255, 0.95)" stroke-width="2.5" />

  <!-- Holographic Scanner Visor Eye -->
  <rect x="74" y="86" width="52" height="28" rx="14" fill="#0B1524" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" />
  
  <!-- Glowing Scanning Aperture -->
  <ellipse cx="100" cy="100" rx="16" ry="7" fill="url(#scanGrad)" filter="url(#analyzingGlow)" />
  <circle cx="100" cy="100" r="4" fill="#FFFFFF" />

  <!-- Downward Scanning Telemetry Cone -->
  <polygon points="90,114 110,114 140,185 60,185" fill="url(#scanBeam)" />
  <line x1="60" y1="185" x2="140" y2="185" stroke="#00D9F5" stroke-width="2" stroke-dasharray="4 2" opacity="0.8" />

  <!-- Orbiting Data Nodes -->
  <circle cx="100" cy="38" r="4" fill="#00D9F5" filter="url(#analyzingGlow)" />
  <circle cx="100" cy="162" r="3.5" fill="#8174FF" filter="url(#analyzingGlow)" />

  <!-- Specular Lens Arc -->
  <path d="M78 80 C88 68 112 68 122 80" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
